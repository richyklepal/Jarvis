<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Jarvis</title>
<style>
:root{
  --bg:#05080d; --panel:#0b121b; --line:#16324a; --ink:#d9eefc; --dim:#7f9bb3;
  --arc:#4fd1ff; --arc-soft:rgba(79,209,255,.14); --you:#13283b; --warn:#ff8a7a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#0c2236 0%,var(--bg) 60%);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);
  padding-top:max(14px,env(safe-area-inset-top))}
.core{width:34px;height:34px;border-radius:50%;flex:none;border:2px solid var(--arc);
  box-shadow:0 0 14px var(--arc),inset 0 0 10px var(--arc);position:relative}
.core::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--arc);opacity:.75}
body.busy .core{animation:pulse 1.1s ease-in-out infinite}
body.listening .core{border-color:var(--warn);box-shadow:0 0 16px var(--warn),inset 0 0 10px var(--warn)}
@keyframes pulse{50%{box-shadow:0 0 26px var(--arc),inset 0 0 16px var(--arc)}}
h1{font:600 15px/1 "SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.32em;margin:0}
.status{font:12px/1.2 ui-monospace,Menlo,monospace;color:var(--dim);margin-top:5px;letter-spacing:.06em}
.spacer{flex:1}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:10px;
  min-height:44px;min-width:44px;padding:0 12px;cursor:pointer}
button:hover{border-color:var(--arc)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--arc);outline-offset:2px}
button[aria-pressed="true"]{background:var(--arc-soft);border-color:var(--arc)}
main{flex:1;overflow-y:auto;padding:18px 16px}
.log{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.msg{padding:11px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:88%}
.me{align-self:flex-end;background:var(--you);border:1px solid var(--line)}
.jv{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--arc)}
.err{align-self:center;color:var(--warn);font-size:14px}
.hint{color:var(--dim);text-align:center;margin-top:12vh;font-size:15px}
footer{border-top:1px solid var(--line);padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
form{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;min-height:44px;max-height:180px;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit}
#mic.on{border-color:var(--warn);background:rgba(255,138,122,.14)}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.gate form{flex-direction:column;align-items:stretch;width:min(340px,100%)}
.gate input{min-height:44px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit}
strong{color:#fff}
@media (max-width:420px){header{gap:10px}header button{padding:0 10px}h1{letter-spacing:.22em}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header>
  <div class="core" aria-hidden="true"></div>
  <div><h1>J.A.R.V.I.S.</h1><div class="status" id="status">Online</div></div>
  <div class="spacer"></div>
  <button id="voice" type="button" aria-pressed="true" title="Speak replies out loud">Voice</button>
  <button id="reset" type="button" title="Start a new conversation">New</button>
</header>

<main id="scroll"><div class="log" id="log" aria-live="polite">
  <p class="hint" id="hint">Type below, or tap the mic and talk.</p>
</div></main>

<footer>
  <form id="form">
    <label class="sr" for="input">Message Jarvis</label>
    <textarea id="input" rows="1" placeholder="Message Jarvis…" autocomplete="off"></textarea>
    <button id="mic" type="button" aria-label="Talk to Jarvis" title="Talk">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button type="submit">Send</button>
  </form>
</footer>

<script>
(function(){
  "use strict";
  var NEEDS_TOKEN = __NEEDS_TOKEN__;
  var $ = function(id){ return document.getElementById(id); };
  var log = $("log"), input = $("input"), statusEl = $("status");
  var store = { get:function(k){ try{return localStorage.getItem(k);}catch(e){return null;} },
                set:function(k,v){ try{localStorage.setItem(k,v);}catch(e){} } };
  var conv = store.get("jarvis-conv") || Math.random().toString(36).slice(2);
  store.set("jarvis-conv", conv);
  var token = store.get("jarvis-token") || "";
  var speakOn = store.get("jarvis-voice") !== "off";
  $("voice").setAttribute("aria-pressed", String(speakOn));

  function setStatus(t){ statusEl.textContent = t; }
  function add(cls, text){
    var h = $("hint"); if (h) h.remove();
    var d = document.createElement("div"); d.className = "msg " + cls;
    if (cls === "jv") render(d, text); else d.textContent = text;
    log.appendChild(d); $("scroll").scrollTop = $("scroll").scrollHeight; return d;
  }

  // Bold (**x**) without ever inserting HTML: build text nodes and <strong> elements.
  function render(el, text){
    var parts = text.split(/(\*\*[^*\n]+\*\*)/g);
    parts.forEach(function(part){
      if (/^\*\*[^*\n]+\*\*$/.test(part)) { var b = document.createElement("strong"); b.textContent = part.slice(2,-2); el.appendChild(b); }
      else el.appendChild(document.createTextNode(part.replace(/^#{1,6}\s+/gm, "")));
    });
  }

  // ---- voice out: the browser's British voice (Daniel on a Mac) ----
  var voice = null;
  function pickVoice(){
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    var prefs = [/Daniel.*(Enhanced|Premium)/i, /^Daniel/i, /Google UK English Male/i, /Arthur|Oliver/i];
    for (var i=0;i<prefs.length && !voice;i++) voice = vs.filter(function(v){ return prefs[i].test(v.name); })[0] || null;
    if (!voice) voice = vs.filter(function(v){ return /en-GB/i.test(v.lang); })[0] || null;
  }
  if (window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function clean(t){
    return t.replace(/```[\s\S]*?```/g," ").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1")
            .replace(/https?:\/\/\S+/g,"a link").replace(/[*_`#>|]+/g,"").replace(/\s+/g," ").trim();
  }
  function say(text){
    if (!speakOn || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(clean(text));
    if (voice) u.voice = voice; u.rate = 1.0; u.pitch = 0.95;
    speechSynthesis.speak(u);
  }

  // ---- talking to the server ----
  function api(path, body){
    return fetch(path, { method:"POST", headers:{ "Content-Type":"application/json", "X-Jarvis-Token": token },
                         body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error || r.status); return j; }); });
  }
  var busy = false;
  function send(text){
    text = (text || "").trim(); if (!text || busy) return;
    busy = true; document.body.classList.add("busy"); setStatus("Thinking…");
    add("me", text); input.value = ""; grow();
    api("/api/chat", { conv: conv, text: text })
      .then(function(j){ add("jv", j.reply); say(j.reply); setStatus("Online"); })
      .catch(function(e){
        if (String(e.message).indexOf("password") >= 0) { store.set("jarvis-token",""); showGate(); }
        add("err", String(e.message || e)); setStatus("Error");
      })
      .then(function(){ busy = false; document.body.classList.remove("busy"); });
  }

  $("form").addEventListener("submit", function(e){ e.preventDefault(); send(input.value); });
  input.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(input.value); }
  });
  function grow(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight,180) + "px"; }
  input.addEventListener("input", grow);
  $("voice").addEventListener("click", function(){
    speakOn = !speakOn; store.set("jarvis-voice", speakOn ? "on" : "off");
    this.setAttribute("aria-pressed", String(speakOn));
    if (!speakOn && window.speechSynthesis) speechSynthesis.cancel();
  });
  $("reset").addEventListener("click", function(){
    api("/api/reset", { conv: conv }).catch(function(){});
    conv = Math.random().toString(36).slice(2); store.set("jarvis-conv", conv);
    log.innerHTML = '<p class="hint" id="hint">New conversation.</p>';
  });

  // ---- voice in: browser speech recognition (Safari and Chrome) ----
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null, listening = false;
  if (!SR) { $("mic").disabled = true; $("mic").title = "Voice input isn't supported in this browser — use Safari or Chrome."; }
  $("mic").addEventListener("click", function(){
    if (!SR) return;
    if (listening && rec) { rec.stop(); return; }
    if (window.speechSynthesis) speechSynthesis.cancel();
    rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false;
    var finalText = "";
    rec.onresult = function(ev){
      var interim = "";
      for (var i = ev.resultIndex; i < ev.results.length; i++){
        if (ev.results[i].isFinal) finalText += ev.results[i][0].transcript; else interim += ev.results[i][0].transcript;
      }
      input.value = finalText + interim; grow();
    };
    rec.onstart = function(){ listening = true; $("mic").classList.add("on"); document.body.classList.add("listening"); setStatus("Listening…"); };
    rec.onend = function(){
      listening = false; $("mic").classList.remove("on"); document.body.classList.remove("listening");
      if (statusEl.textContent === "Listening…") setStatus("Online");
      if (finalText.trim()) send(finalText);
    };
    rec.onerror = function(ev){ add("err", "Mic: " + ev.error + (ev.error === "not-allowed" ? " — allow microphone access for this page." : "")); };
    rec.start();
  });

  // ---- password gate (only when WEB_TOKEN is set) ----
  function showGate(){
    var g = document.createElement("div"); g.className = "gate";
    g.innerHTML = '<form><label for="pw">Jarvis password</label><input id="pw" type="password" autocomplete="current-password"><button type="submit">Unlock</button></form>';
    document.body.appendChild(g); g.querySelector("input").focus();
    g.querySelector("form").addEventListener("submit", function(e){
      e.preventDefault(); token = g.querySelector("input").value; store.set("jarvis-token", token); g.remove();
    });
  }
  if (NEEDS_TOKEN && !token) showGate();
  input.focus();
})();
</script>
</body>
</html>
